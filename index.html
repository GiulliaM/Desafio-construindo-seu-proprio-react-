<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Didact</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f2f5;
      font-family: sans-serif;
    }

    #root > div {
      background: white;
      border-radius: 16px;
      padding: 48px 64px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #1a1a2e;
      margin-bottom: 32px;
    }

    button {
      width: 52px;
      height: 52px;
      font-size: 1.5rem;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      margin: 0 8px;
      background-color: #4f46e5;
      color: white;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: #4338ca;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="didact.js"></script>
  <script type="text/babel" src="app.js"></script>
</body>
</html>
